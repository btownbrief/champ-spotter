  #best .pc .stars { font-size: calc(var(--u) * 20); bottom: calc(var(--u) * 6); }
  #best .ribbon { position: absolute; top: calc(var(--u) * -14); left: 50%; transform: translateX(-50%) rotate(-2deg); white-space: nowrap; background: linear-gradient(180deg, #ffe58a, #f6b81f); color: #5a3a00; font-family: 'Bowlby One', sans-serif; font-size: calc(var(--u) * 13); padding: calc(var(--u) * 4) calc(var(--u) * 14); border-radius: calc(var(--u) * 4); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(0,0,0,.5); }

  body.compact .logo .l1 { font-size: calc(var(--u) * 54); } body.compact .logo .l2 { font-size: calc(var(--u) * 24); } body.compact .logo { padding: calc(var(--u) * 8) calc(var(--u) * 14); margin-bottom: calc(var(--u) * 2); }

  body.compact .screen { padding-top: calc(var(--u) * 10 + var(--inset-top, 0px)); padding-bottom: calc(var(--u) * 12 + var(--inset-bot, 0px)); }

<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="hudRow">
      <div class="chip" id="filmChip"><svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1 2v3h2V5H5zm0 5v3h2v-3H5zm0 5v3h2v-3H5zm12-10v3h2V5h-2zm0 5v3h2v-3h-2zm0 5v3h2v-3h-2zM9 5v14h6V5H9z"/></svg><b id="filmN">9</b></div>
      <div id="hudC">
        <div id="scoreRow"><b id="scoreN">0</b> <i id="tgtTxt">/ 190</i></div>
        <div id="bar"><div id="barFill"></div><div id="barT"></div></div>
        <div id="pips"></div>
      </div>
      <div id="hudR">
        <button class="round" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" stroke="none"/><path id="sndWaves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="round" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" stroke="none"/></svg></button>
      </div>
    </div>
    <div id="assign"></div>
    <div id="streak"></div>
  </div>
  <div id="toast"><span class="t"></span></div>

  <section id="title" class="screen shade lite">
    <div class="logo"><i></i><i></i><i></i><i></i><span class="l1 disp">CHAMP</span><span class="l2 disp">SPOTTER</span></div>
    <div class="tag">A TAP-TO-SNAP PHOTO SAFARI</div>
    <div class="stack">
      <button class="btn big" id="btnPlay">PLAY</button>
      <div class="row" style="margin-top:0">
        <button class="btn alt" id="btnRounds">ROUNDS</button>
        <button class="btn alt" id="btnAlbum">ALBUM</button>
      </div>
      <div class="row duo" style="margin-top:0">
        <button class="btn alt gold" id="btnDaily">DAILY LAKE</button>
        <button class="btn alt gold" id="btnSunset">SUNSET</button>
      </div>
      <div class="small" id="dailyNote" style="margin-top:0"></div>
    </div>
    <div class="footrow"><button class="btn alt" id="btnSfx">SOUND ON</button><button class="btn alt" id="btnMus">MUSIC ON</button></div>
  </section>

  <section id="rounds" class="screen shade">
    <h2 class="disp">ROUNDS</h2>
    <div class="row" id="rdTabs" style="margin:0 0 calc(var(--u)*8)"><button class="btn alt tab" id="tabN">NORMAL</button><button class="btn alt tab" id="tabP">PRO</button></div>
    <div class="sub" id="rdSub">Clear a round to open the next.</div>
    <div id="roundsGrid"></div>
    <button class="btn alt" id="rdBack">BACK</button>
  </section>

  <section id="result" class="screen shade" style="justify-content:safe center;overflow-y:auto;touch-action:pan-y">
    <h2 class="disp" id="rsTitle">ROLL DEVELOPED!</h2>
    <div class="sub" id="rsSub"></div>
    <div class="starrow" id="rsStars"></div>
    <div class="small" id="rsWhy" style="margin:calc(var(--u)*-6) 0 calc(var(--u)*8)"></div>
    <div id="rsGoalsH"></div><div id="rsGoals"></div>
    <div class="stat">Score <b id="rsScore">0</b> <span id="rsTgt"></span></div>
    <div class="small" id="rsBonus" style="margin-top:0"></div>
    <div id="sheet"></div>
    <div id="rsBadges"></div>
    <div class="row">
      <button class="btn big" id="rsNext">NEXT ROUND</button>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn alt" id="rsRetry">RETRY</button><button class="btn alt" id="rsAlbum">ALBUM</button><button class="btn alt" id="rsMenu">MENU</button></div>
  </section>

  <section id="album" class="screen shade">
    <h2 class="disp">SCRAPBOOK</h2>
    <div id="albumScroll">
      <div id="best"></div>
      <h3 id="gridH">MY BEST SHOTS</h3>
      <div id="grid"></div>
      <div class="small" id="medalsLine" style="font-size:calc(var(--u)*14);color:#fff1c4"></div>
      <h3 id="pagesH">FRONT PAGES</h3>
      <div id="pages"></div>
      <h3 id="guideH">CHAMP SIGHTINGS</h3>
      <div id="guide"></div>
      <h3 id="shotH">SHOT BOOK</h3>
      <div id="shots"></div>
      <h3>LAKE LIFE (NOT MONSTERS)</h3>
      <div id="life"></div>
    </div>
    <button class="btn alt" id="alBack">BACK</button>
  </section>

  <section id="pause" class="screen shade">
    <h2 class="disp">PAUSED</h2>
    <div class="sub" id="pauseSub"></div>
    <div class="stack">
      <button class="btn big" id="pResume">RESUME</button>
      <div class="row" style="margin-top:0"><button class="btn alt" id="pSfx">SOUND ON</button><button class="btn alt" id="pMus">MUSIC ON</button></div>
      <div class="row" style="margin-top:0"><button class="btn alt" id="pRestart">RESTART</button><button class="btn alt" id="pQuit">QUIT</button></div>
    </div>
  </section>

  <section id="zoom" class="screen"><div class="pc" id="zoomPc"></div></section>
</div>
<noscript>Champ Spotter needs JavaScript.</noscript>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
